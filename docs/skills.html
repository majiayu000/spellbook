<style>

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--serif); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }

.activetag { margin-top: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }

.count { font-family: var(--mono); font-size: 12px; color: var(--muted); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; transition: border-color 0.15s, transform 0.15s; text-align: left; color: inherit; }

.modal .tags { margin-top: 16px; }
.close-x { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-family: var(--mono); font-size: 14px; }
.close-x:hover { border-color: var(--accent); color: var(--accent); }
.cmd { display: flex; align-items: center; gap: 12px; background: var(--panel-deep); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-family: var(--mono); font-size: 12.5px; margin-top: 18px; }

.cmd-label { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin: 20px 0 6px; }
.actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.btn { font-family: var(--mono); font-size: 12px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; display: inline-flex; align-items: center; }

footer { border-top: 1px solid var(--border); padding: 24px 32px; text-align: center; color: var(--muted); font-family: var(--mono); font-size: 12px; }

@media (max-width: 640px) {

/* registry-data:end */

const GH_BASE = 'https://github.com/majiayu000/spellbook/blob/main/';
const state = { q: '', cat: null, tag: null };

const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const countEl = document.getElementById('count');
const chipsEl = document.getElementById('catChips');
const searchEl = document.getElementById('search');
const activeTagEl = document.getElementById('activeTag');
const backdrop = document.getElementById('backdrop');
const modal = document.getElementById('modal');

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

const categories = [...new Set(SKILLS.map(s => s.category))]
  .map(name => ({ name, count: SKILLS.filter(s => s.category === name).length }))
  .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));

const allTags = new Set();
SKILLS.forEach(s => (s.tags || []).forEach(t => allTags.add(t)));

document.getElementById('stats').textContent =
  `${SKILLS.length} skills · ${categories.length} categories · ${allTags.size} tags`;

function matches(skill) {
  if (state.cat && skill.category !== state.cat) return false;
  if (state.tag && !(skill.tags || []).includes(state.tag)) return false;
  const q = state.q.trim().toLowerCase();
  if (!q) return true;
  const hay = [skill.name, skill.description, skill.category, ...(skill.tags || [])]
    .join(' ').toLowerCase();
  return q.split(/\s+/).every(word => hay.includes(word));
}

function filteredSkills() {
  return SKILLS.filter(matches)
    .sort((a, b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name));
}

function renderChips() {
  chipsEl.replaceChildren();
  const all = el('button', 'chip' + (state.cat ? '' : ' on'));
  all.type = 'button';
  all.append(document.createTextNode('All'), el('span', 'n', String(SKILLS.length)));
  all.addEventListener('click', () => { state.cat = null; renderAll(); });
  chipsEl.append(all);
  for (const c of categories) {
    const chip = el('button', 'chip' + (state.cat === c.name ? ' on' : ''));
    chip.type = 'button';
    chip.append(document.createTextNode(c.name), el('span', 'n', String(c.count)));
    chip.addEventListener('click', () => {
      state.cat = state.cat === c.name ? null : c.name;
      renderAll();
    });
    chipsEl.append(chip);
  }
}

function renderActiveTag() {
  activeTagEl.replaceChildren();
  activeTagEl.hidden = !state.tag;
  if (!state.tag) return;
  activeTagEl.append(el('span', null, 'tag:'));
  const pill = el('button', null, `#${state.tag} ×`);
  pill.type = 'button';
  pill.addEventListener('click', () => { state.tag = null; renderAll(); });
  activeTagEl.append(pill);
}

function makeTagButton(tagName) {
  const btn = el('button', 'tag', `#${tagName}`);
  btn.type = 'button';
  btn.addEventListener('click', event => {
    event.stopPropagation();
    state.tag = state.tag === tagName ? null : tagName;
    renderAll();
  });
  return btn;
}

function renderGrid() {
  const list = filteredSkills();
  grid.replaceChildren();
  countEl.textContent = `${list.length} of ${SKILLS.length} skills`;
  emptyEl.hidden = list.length > 0;
  for (const skill of list) {
    const card = el('button', 'card');
    card.type = 'button';
    const cat = el('div', 'cat');
    cat.append(el('span', null, skill.category));
    if (skill.language === 'zh') cat.append(el('span', 'lang', '中文'));
    card.append(cat, el('h3', null, skill.name), el('p', null, skill.description));
    const tags = el('div', 'tags');
    (skill.tags || []).forEach(t => tags.append(makeTagButton(t)));
    card.append(tags);
    card.addEventListener('click', () => openModal(skill));
    grid.append(card);
  }
}

function openModal(skill) {
  modal.replaceChildren();
  const close = el('button', 'close-x', '×');
  close.type = 'button';
  close.setAttribute('aria-label', 'Close');
  close.addEventListener('click', closeModal);

  const head = el('div', 'cat');
  head.append(el('span', null, skill.category));
  if (skill.language === 'zh') head.append(el('span', 'lang', '中文'));

  const tags = el('div', 'tags');
  (skill.tags || []).forEach(t => tags.append(makeTagButton(t)));

  const installCmd = `npx skills add majiayu000/spellbook --skill ${skill.name}`;
  const cmd = el('div', 'cmd');
  cmd.append(el('code', null, installCmd));
  const copyBtn = el('button', 'btn primary', 'Copy');
  copyBtn.type = 'button';
  copyBtn.addEventListener('click', () => copyText(installCmd, copyBtn));
  cmd.append(copyBtn);

  const actions = el('div', 'actions');
  const source = el('a', 'btn', 'View SKILL.md on GitHub ↗');
  source.href = GH_BASE + skill.path;
  source.target = '_blank';
  source.rel = 'noopener noreferrer';
  actions.append(source);

  modal.append(
    close,
    head,
    el('h2', null, skill.name),
    el('p', 'desc', skill.description),
    tags,
    el('div', 'cmd-label', 'Install'),
    cmd,
    actions,
  );
  backdrop.hidden = false;
  document.body.style.overflow = 'hidden';
  close.focus();
}

function closeModal() {
  backdrop.hidden = true;
  document.body.style.overflow = '';
}

function copyText(text, btn) {
  const done = () => {
    btn.textContent = 'Copied ✓';
    setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const area = document.createElement('textarea');
  area.value = text;
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.append(area);
  area.select();
  try { document.execCommand('copy'); done(); } finally { area.remove(); }
}

function renderAll() {
  renderChips();
  renderActiveTag();
  renderGrid();
}

searchEl.addEventListener('input', () => { state.q = searchEl.value; renderGrid(); });
document.getElementById('clearFilters').addEventListener('click', () => {
  state.q = ''; state.cat = null; state.tag = null;
  searchEl.value = '';
  renderAll();
});
backdrop.addEventListener('click', event => { if (event.target === backdrop) closeModal(); });

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    if (!backdrop.hidden) closeModal();
    return;
  }
  if (event.key === '/' && document.activeElement !== searchEl) {
    event.preventDefault();
    searchEl.focus();
  }
});

renderAll();
</script>
</body>
</html>
