:root{--ink:#20211f;--muted:#797a74;--paper:#faf9f6;--line:#e3e2dc;--canvas:#f0efea;font-family:Geist,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper);font-synthesis:none}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;color:inherit}button:disabled{cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid #777f5d;outline-offset:5px}button{border:0;-webkit-tap-highlight-color:transparent}a{color:inherit;text-underline-offset:4px}svg{display:block;flex-shrink:0}h1,h2,h3,p{margin:0}.mono{font-family:Geist,monospace;font-variant-numeric:tabular-nums}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}.rail{border-right:1px solid var(--line);padding:30px 16px;display:flex;flex-direction:column;gap:28px}.brand{font-size:25px;font-weight:650;letter-spacing:-1.5px;padding:0 14px;display:flex;align-items:center;gap:10px}.brand-dot{width:15px;height:15px;background:var(--ink);border-radius:5px;transform:rotate(-15deg)}.rail-label{font-size:10px;letter-spacing:1.8px;color:var(--muted);padding:0 14px;margin-bottom:10px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{text-align:left;background:transparent;padding:13px 13px;border-radius:9px;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:450}.nav button:hover{background:#eeede7}.nav button[aria-current=true]{background:#252622;color:#fff}.nav-num{font-size:11px;opacity:.48;font-variant-numeric:tabular-nums}.rail-foot{margin-top:auto;padding:20px 14px 0;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.8}.rail-foot a{display:inline-block;margin-top:7px}
main{padding:30px 38px 24px;max-width:1540px;width:100%;margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;padding-bottom:23px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);letter-spacing:1.2px}.topbar span:last-child{letter-spacing:0}.intro{display:flex;align-items:flex-end;justify-content:space-between;margin:28px 0 22px;gap:20px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:11px}h1{font-weight:500;font-size:34px;letter-spacing:-1.4px;line-height:1.25}.name-en{font-size:12px;color:var(--muted);margin-top:9px}.stepper{display:flex;gap:7px;align-items:center}.stepper button{width:33px;height:33px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:transparent}.stepper button:hover{background:#eeede7}.stepper span{font-size:11px;color:var(--muted);padding-right:10px;font-variant-numeric:tabular-nums}
